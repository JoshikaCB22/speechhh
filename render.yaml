services:
  - type: web
    name: speechcare-backend
    runtime: python
    buildCommand: pip install -r Speech_Backend/requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./speech_therapy.db
      - key: JWT_SECRET_KEY
        value: your-secret-key-change-this-in-production
      - key: ENVIRONMENT
        value: production

  - type: web
    name: speechcare-frontend
    runtime: node
    buildCommand: cd speech-frontend && npm install && npm run build
    startCommand: cd speech-frontend && npm start
    envVars:
      - key: VITE_API_URL
        value: https://speechcare-backend.onrender.com
